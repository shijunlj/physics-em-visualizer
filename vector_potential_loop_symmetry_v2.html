<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>半径为 a 的环形导线电流 I 的矢势 A（对称电流元与径向分量抵消演示）</title>
  <!-- 引入 Three.js 与 OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- 引入 KaTeX 渲染数学公式 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '\\(', right: '\\)', display: false}]});"></script>
  <style>
    :root {
      --bg: #080c16;
      --panel-bg: rgba(15, 23, 42, 0.86);
      --border: rgba(148, 163, 184, 0.20);
      --c-wire: #e2e8f0;     /* 银色环形导线 */
      --c-a: #10b981;        /* 半径 a：醒目翠绿（虚线） */
      --c-R: #38bdf8;        /* 距离 R (OP)：醒目天蓝（虚线） */
      --c-rprime: #f43f5e;   /* 距离 r'：醒目红色（实线） */
      --c-phi: #c084fc;      /* 夹角 φ 与辅助色：亮紫 */
      --c-vecA: #22d3ee;     /* 磁矢势 A：亮青色 */
      --c-rad: #fb7185;      /* 径向抵消分量 dA_r：珊瑚粉红 */
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 50%, #0f172a 0%, #060911 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* 左侧 3D 视图容器：占据屏幕左半区（50vw），使左图自然靠左并与右图等大 */
    #webgl-container {
      width: 50vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* 左上角：紧凑题干与线型图例卡片 */
    #header-card {
      position: absolute;
      top: 14px;
      left: 16px;
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 14px;
      max-width: 470px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.40);
    }

    #header-card h1 {
      font-size: 14.5px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      font-size: 11.5px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .legend-swatch {
      width: 18px;
      height: 3.5px;
      border-radius: 2px;
    }

    .legend-swatch.dashed-a {
      background: repeating-linear-gradient(90deg, var(--c-a) 0 5px, transparent 5px 9px);
    }

    .legend-swatch.dashed-R {
      background: repeating-linear-gradient(90deg, var(--c-R) 0 5px, transparent 5px 9px);
    }

    /* 右上角：小巧独立按键栏（自适应宽度，无需与右图一样宽） */
    #ui-panel {
      position: absolute;
      top: 14px;
      right: 18px;
      z-index: 20;
      width: auto;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 8px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .btn {
      padding: 5px 10px;
      background: rgba(30, 41, 59, 0.88);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
    }

    .btn:hover {
      background: rgba(51, 65, 85, 0.95);
      border-color: rgba(148, 163, 184, 0.45);
    }

    .btn.active {
      background: rgba(56, 189, 248, 0.22);
      border-color: #38bdf8;
      color: #38bdf8;
      font-weight: 600;
    }

    .btn.action-random {
      background: rgba(16, 185, 129, 0.18);
      border-color: rgba(16, 185, 129, 0.55);
      color: #34d399;
      font-weight: 600;
    }

    .btn.action-random:hover {
      background: rgba(16, 185, 129, 0.30);
    }

    .btn.sym-toggle.active {
      background: rgba(192, 132, 252, 0.20);
      border-color: rgba(192, 132, 252, 0.65);
      color: #d8b4fe;
      font-weight: 600;
    }

    /* 右半区：与左图等大的 2D 线圈平面投影区 */
    #proj-card {
      position: absolute;
      top: 62px;
      right: 18px;
      bottom: 16px;
      width: 47vw;
      z-index: 10;
      background: rgba(11, 17, 30, 0.72);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .proj-title {
      width: 100%;
      font-size: 13px;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .proj-canvas-wrap {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #proj-canvas {
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 1 / 1;
      background: rgba(7, 11, 20, 0.85);
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.14);
      display: block;
    }
  </style>
</head>
<body>

  <!-- 左半屏 3D 渲染画布（左图） -->
  <div id="webgl-container"></div>

  <!-- 左上角：题目与线型颜色图例 -->
  <div id="header-card">
    <h1>
      <span>半径为 \(a\) 的环形导线有电流 \(I\). 求矢势和磁感应强度.</span>
    </h1>
    <div class="legend-strip">
      <div class="legend-item">
        <span class="legend-swatch" style="background: var(--c-wire);"></span>
        <span>导线 \(I\) (银色)</span>
      </div>
      <div class="legend-item">
        <span class="legend-swatch dashed-a"></span>
        <span style="color: var(--c-a); font-weight: 600;">\(a\) (翠绿虚线)</span>
      </div>
      <div class="legend-item">
        <span class="legend-swatch dashed-R"></span>
        <span style="color: var(--c-R); font-weight: 600;">\(R(OP)\) (天蓝虚线)</span>
      </div>
      <div class="legend-item">
        <span class="legend-swatch" style="background: var(--c-rprime);"></span>
        <span style="color: var(--c-rprime); font-weight: 600;">\(r'\) (红色实线)</span>
      </div>
    </div>
  </div>

  <!-- 右上角：紧凑小按键条（自适应宽度，不与右图等宽） -->
  <div id="ui-panel">
    <button class="btn active" id="btn-view-side" onclick="resetAll()">
      <span>🔄 重置</span>
    </button>
    <button class="btn" id="btn-view-ring" onclick="setCameraPreset('RING')">
      <span>👁️ 对着圆环看</span>
    </button>
    <button class="btn action-random" onclick="randomizeCurrentElement()">
      <span>🎯 变换电流元位置</span>
    </button>
    <button class="btn" id="btn-sweep-phi" onclick="toggleSweepPhi()">
      <span>🔄 循环电流元 φ</span>
    </button>
    <button class="btn sym-toggle active" id="btn-toggle-sym" onclick="toggleSymmetricElement()">
      <span>🌗 隐藏对称电流元 (-φ)</span>
    </button>
    <button class="btn action-random" onclick="randomizePointP()">
      <span>🎲 改变 P 点位置</span>
    </button>
  </div>

  <!-- 右半屏：与左图等大的 2D 线圈平面投影图 -->
  <div id="proj-card">
    <div class="proj-title">
      <span>⭕ 在线圈平面的投影（对称电流元与 \(\mathrm{d}\vec{A}\) 径向分量抵消）</span>
      <span style="color: var(--c-phi); font-family: monospace;" id="proj-phi-txt">±φ = ±40°</span>
    </div>
    <div class="proj-canvas-wrap">
      <canvas id="proj-canvas" width="820" height="820"></canvas>
    </div>
  </div>

  <script>
    /* ==============================================================
       1. Three.js 左半屏三维场景初始化（让左图靠左、尺寸适中并与右图等大）
       ============================================================== */
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(38, container.clientWidth / container.clientHeight, 0.1, 1000);
    const controls = new THREE.OrbitControls(camera, container);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    // 相机距离适度拉远，使左图稍小一些，与右侧大幅投影图视觉尺寸 1:1 匹配
    camera.position.set(4.5, 2.5, 6.2);
    controls.target.set(0.95, 0.25, 0.0);
    controls.update();

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // 照明：突出银色导线的金属质感
    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight1.position.set(5, 8, 6);
    scene.add(dirLight1);
    const dirLight2 = new THREE.DirectionalLight(0x94a3b8, 0.5);
    dirLight2.position.set(-5, -4, -4);
    scene.add(dirLight2);

    /* ==============================================================
       2. 醒目颜色常量与统一线宽工具函数
       - r' 为红色实线 (LINE_RADIUS = 0.018)
       - a、R (OP) 为与 r' 同样粗的 3D 圆柱虚线 (LINE_RADIUS = 0.018)
       - OP (R)、r、z 的线粗细均与 r' 完全相同 (LINE_RADIUS = 0.018)
       ============================================================== */
    const COLORS = {
      wire: 0xe2e8f0,
      a: 0x10b981,
      R: 0x38bdf8,
      rprime: 0xf43f5e,
      zr: 0xe2e8f0,
      phi: 0xc084fc,
      vecA: 0x22d3ee,
      radCancel: 0xfb7185
    };

    const LINE_RADIUS = 0.018; // r'、a、R (OP)、r、z 统一的 3D 线粗细半径

    // 绘制无矩形框的纯净斜体数学符号标签
    function makeLabelSprite(text, color = '#ffffff', fontSize = 36, scaleHeight = 0.28, opacity = 1.0) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const fontStr = `italic bold ${fontSize}px "Times New Roman", "Georgia", serif`;
      ctx.font = fontStr;
      const textW = ctx.measureText(text).width;

      const padX = 24;
      canvas.width = Math.max(80, Math.ceil(textW + padX * 2));
      canvas.height = 68;

      ctx.font = fontStr;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.shadowColor = 'rgba(2, 6, 23, 0.95)';
      ctx.shadowBlur = 8;
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(2, 6, 23, 0.85)';
      ctx.strokeText(text, canvas.width / 2, canvas.height / 2);

      ctx.fillStyle = color;
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);

      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({
        map: tex,
        transparent: true,
        opacity: opacity,
        depthTest: false
      });
      const sprite = new THREE.Sprite(mat);
      const aspect = canvas.width / canvas.height;
      sprite.scale.set(scaleHeight * aspect, scaleHeight, 1);
      return sprite;
    }

    // 细辅助参考虚线（仅用于坐标轴延长线和辅助圆周）
    function createThinDashedSegment(p1, p2, colorHex, dashSize = 0.08, gapSize = 0.05, opacity = 1.0) {
      const geo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
      const mat = new THREE.LineDashedMaterial({
        color: colorHex,
        dashSize,
        gapSize,
        linewidth: 1,
        transparent: opacity < 1.0,
        opacity: opacity
      });
      const line = new THREE.Line(geo, mat);
      line.computeLineDistances();
      return line;
    }

    // 实线 3D 圆柱管（用于 r' 红色实线、r、z 等）
    function createSolidSegment(p1, p2, colorHex, radius = LINE_RADIUS, opacity = 1.0) {
      const curve = new THREE.LineCurve3(p1, p2);
      const geo = new THREE.TubeGeometry(curve, 8, radius, 12, false);
      const mat = new THREE.MeshBasicMaterial({
        color: colorHex,
        transparent: opacity < 1.0,
        opacity: opacity,
        depthWrite: opacity >= 1.0
      });
      return new THREE.Mesh(geo, mat);
    }

    // 与 r' 同样粗的 3D 圆柱虚线（用于 a、R(OP) 等，保证在 WebGL 中与实线 r' 粗细完全一致！）
    function createThickDashedSegment(p1, p2, colorHex, radius = LINE_RADIUS, dashLen = 0.095, gapLen = 0.065, opacity = 1.0) {
      const group = new THREE.Group();
      const totalDist = p1.distanceTo(p2);
      if (totalDist < 1e-4) return group;

      const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
      const step = dashLen + gapLen;
      const mat = new THREE.MeshBasicMaterial({
        color: colorHex,
        transparent: opacity < 1.0,
        opacity: opacity,
        depthWrite: opacity >= 1.0
      });
      const upVec = new THREE.Vector3(0, 1, 0);
      const quat = new THREE.Quaternion().setFromUnitVectors(upVec, dir);

      for (let s = 0; s < totalDist; s += step) {
        const segLen = Math.min(dashLen, totalDist - s);
        if (segLen < 0.01) break;
        const cylGeo = new THREE.CylinderGeometry(radius, radius, segLen, 10);
        const mesh = new THREE.Mesh(cylGeo, mat);
        const mid = new THREE.Vector3().copy(p1).addScaledVector(dir, s + segLen * 0.5);
        mesh.position.copy(mid);
        mesh.quaternion.copy(quat);
        group.add(mesh);
      }
      return group;
    }

    function createCustomArrow(dir, originPt, length, colorHex, headLen = 0.14, headRadius = 0.048, shaftRadius = LINE_RADIUS, opacity = 1.0) {
      const group = new THREE.Group();
      const d = dir.clone().normalize();
      const shaftLen = Math.max(0.02, length - headLen);
      const shaftEnd = originPt.clone().addScaledVector(d, shaftLen);

      group.add(createSolidSegment(originPt, shaftEnd, colorHex, shaftRadius, opacity));

      const coneGeo = new THREE.ConeGeometry(headRadius, headLen, 14);
      const coneMat = new THREE.MeshBasicMaterial({
        color: colorHex,
        transparent: opacity < 1.0,
        opacity: opacity,
        depthWrite: opacity >= 1.0
      });
      const cone = new THREE.Mesh(coneGeo, coneMat);
      cone.position.copy(originPt).addScaledVector(d, shaftLen + headLen * 0.5);
      cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d);
      group.add(cone);

      return group;
    }

    /* ==============================================================
       3. 物理状态
       ============================================================== */
    const params = {
      a: 1.20,
      z: 2.10,
      r: 1.45,
      thetaPDeg: 20, // 空间任一点 P 偏离圆环纵轴（竖直面）的角度，设为较小的 20°
      thetaQDeg: 60, // 环上所取电流元 Q1 初始方位角 (20° + 40° = 60°，保持 φ = 40°)
      phiDeg: 40     // 电流元 Q1 相对场点子午面径向 e_r 的夹角 φ = thetaQ - thetaP
    };

    let isSweepingPhi = false;
    let showSymInProjection = true; // 对称电流元开关（仅在右侧 2D 投影图中显示，左图 3D 视图不增加）

    /* ==============================================================
       4. 构建左图 3D 场景与右图等大 2D 线圈平面投影
       ============================================================== */
    const rootGroup = new THREE.Group();
    scene.add(rootGroup);

    function updateScene() {
      while (rootGroup.children.length > 0) rootGroup.remove(rootGroup.children[0]);

      const { a, z, r, thetaPDeg, thetaQDeg } = params;
      const thetaP = (thetaPDeg * Math.PI) / 180;
      const thetaQ = (thetaQDeg * Math.PI) / 180;
      // 电流元 Q1 相对场点 P 子午面径向 e_r 的有向夹角 φ ∈ (-π, π]
      const phi = Math.atan2(Math.sin(thetaQ - thetaP), Math.cos(thetaQ - thetaP));
      const phiDegNorm = Math.round(((thetaQDeg - thetaPDeg) % 360 + 360) % 360);
      params.phiDeg = phiDegNorm;

      // 单位基矢：
      const er = new THREE.Vector3(0, Math.cos(thetaP), -Math.sin(thetaP));
      const ephi = new THREE.Vector3(0, -Math.sin(thetaP), -Math.cos(thetaP));
      const origin = new THREE.Vector3(0, 0, 0);

      // 1. 中心轴线 z（带右侧 z 轴正向箭头）与环平面十字参考线（细致虚线，带半透明，不抢视觉重心）
      const zAxisLen = Math.max(3.35, z + 0.65);
      const crossRadius = LINE_RADIUS * 0.38; // 细虚线半径约为 0.007，比 r 明显纤细
      rootGroup.add(createThickDashedSegment(new THREE.Vector3(-0.95, 0, 0), origin, 0x94a3b8, crossRadius, 0.08, 0.06, 0.65));
      rootGroup.add(createCustomArrow(new THREE.Vector3(1, 0, 0), origin, zAxisLen, 0x94a3b8, 0.16, 0.052, LINE_RADIUS, 1.0));
      rootGroup.add(createThickDashedSegment(new THREE.Vector3(0, -1.9, 0), new THREE.Vector3(0, 1.9, 0), 0x94a3b8, crossRadius, 0.07, 0.05, 0.60));
      rootGroup.add(createThickDashedSegment(new THREE.Vector3(0, 0, -1.9), new THREE.Vector3(0, 0, 1.9), 0x94a3b8, crossRadius, 0.07, 0.05, 0.60));

      // 2. 银色环形导线 (半径 a)
      const torusGeo = new THREE.TorusGeometry(a, 0.026, 24, 100);
      torusGeo.rotateY(Math.PI / 2);
      const torusMat = new THREE.MeshStandardMaterial({
        color: COLORS.wire,
        roughness: 0.22,
        metalness: 0.85,
        emissive: 0x334155,
        emissiveIntensity: 0.25
      });
      rootGroup.add(new THREE.Mesh(torusGeo, torusMat));

      // 靠近圆环外侧的一小段弯曲电流指示箭头及 I 标签（不标在电流环上）
      const aCurved = a + 0.20;
      const bStart = -0.36; // 弧度范围：沿切向从下至上
      const bEnd = 0.18;
      const curvedArrowPts = [];
      const curvedSteps = 24;
      for (let i = 0; i <= curvedSteps; i++) {
        const u = bStart + (i / curvedSteps) * (bEnd - bStart);
        curvedArrowPts.push(new THREE.Vector3(0, aCurved * Math.sin(u), aCurved * Math.cos(u)));
      }
      const curvedCurve = new THREE.CatmullRomCurve3(curvedArrowPts);
      const curvedTubeGeo = new THREE.TubeGeometry(curvedCurve, 24, 0.013, 10, false);
      const curvedMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      rootGroup.add(new THREE.Mesh(curvedTubeGeo, curvedMat));

      // 弯曲箭头的白色圆锥尖端
      const tipPt = new THREE.Vector3(0, aCurved * Math.sin(bEnd), aCurved * Math.cos(bEnd));
      const tipDir = new THREE.Vector3(0, Math.cos(bEnd), -Math.sin(bEnd)).normalize();
      const tipConeGeo = new THREE.ConeGeometry(0.046, 0.14, 20);
      const tipConeMesh = new THREE.Mesh(tipConeGeo, curvedMat);
      tipConeMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tipDir);
      tipConeMesh.position.copy(tipPt).addScaledVector(tipDir, 0.07);
      rootGroup.add(tipConeMesh);

      // 电流符号 I 标签放在弯曲箭头外侧旁边
      const labelI = makeLabelSprite('I', '#ffffff', 38);
      labelI.position.set(0, aCurved * Math.sin((bStart + bEnd) * 0.5), aCurved * Math.cos((bStart + bEnd) * 0.5) + 0.20);
      rootGroup.add(labelI);

      // 3. 空间任一点 P(r, θ_P, z)
      const ptAxisZ = new THREE.Vector3(z, 0, 0);
      const ptP = new THREE.Vector3().copy(ptAxisZ).addScaledVector(er, r);
      const ptPProjLoop = new THREE.Vector3().addScaledVector(er, r);

      // 所求点 P 标记球
      const pMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.062, 20, 20),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      pMesh.position.copy(ptP);
      rootGroup.add(pMesh);

      const labelP = makeLabelSprite('P', '#ffffff', 34);
      labelP.position.copy(ptP).addScaledVector(er, 0.22).add(new THREE.Vector3(-0.12, 0, 0));
      rootGroup.add(labelP);

      // 【天蓝色粗虚线】R (即 OP 连线：与 r' 同样粗的虚线，OP 线粗细与 r' 完全相同)
      rootGroup.add(createThickDashedSegment(origin, ptP, COLORS.R, LINE_RADIUS, 0.10, 0.065));
      // 【亮银白色粗虚线】r (轴垂足 O' -> 空间点 P，改为与 r' 同样粗的虚线)
      rootGroup.add(createThickDashedSegment(ptAxisZ, ptP, COLORS.zr, LINE_RADIUS, 0.095, 0.06));

      // 垂足直角符号 ⊥
      const raSize = 0.14;
      const raP1 = new THREE.Vector3(z - raSize, 0, 0);
      const raP2 = new THREE.Vector3(z - raSize, 0, 0).addScaledVector(er, raSize);
      const raP3 = new THREE.Vector3(z, 0, 0).addScaledVector(er, raSize);
      rootGroup.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([raP1, raP2, raP3]),
        new THREE.LineBasicMaterial({ color: 0x94a3b8 })
      ));

      // 半透明子午面三角形 (O - O' - P) 与辅助投影虚线
      const triGeo = new THREE.BufferGeometry().setFromPoints([origin, ptAxisZ, ptP]);
      triGeo.setIndex([0, 1, 2]);
      rootGroup.add(new THREE.Mesh(triGeo, new THREE.MeshBasicMaterial({
        color: COLORS.R,
        transparent: true,
        opacity: 0.07,
        side: THREE.DoubleSide,
        depthWrite: false
      })));

      const circlePts = [];
      for (let i = 0; i <= 72; i++) {
        const ang = (i / 72) * Math.PI * 2;
        circlePts.push(new THREE.Vector3(z, r * Math.cos(ang), -r * Math.sin(ang)));
      }
      const circleLine = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(circlePts),
        new THREE.LineDashedMaterial({ color: 0x475569, dashSize: 0.07, gapSize: 0.06 })
      );
      circleLine.computeLineDistances();
      rootGroup.add(circleLine);

      rootGroup.add(createThinDashedSegment(ptP, ptPProjLoop, 0x64748b, 0.06, 0.06, 0.65));
      rootGroup.add(createThinDashedSegment(origin, ptPProjLoop, 0x94a3b8, 0.06, 0.05, 0.75));

      // 标签 z, r, R（无矩形框）
      const labelZ = makeLabelSprite('z', '#e2e8f0', 36);
      labelZ.position.set(z * 0.55, -0.22 * Math.cos(thetaP), 0.22 * Math.sin(thetaP));
      rootGroup.add(labelZ);

      const labelSmallR = makeLabelSprite('r', '#e2e8f0', 36);
      labelSmallR.position.copy(ptAxisZ).addScaledVector(er, r * 0.5).add(new THREE.Vector3(0.20, 0, 0));
      rootGroup.add(labelSmallR);

      const labelBigR = makeLabelSprite('R', '#38bdf8', 38);
      labelBigR.position.copy(ptP).multiplyScalar(0.50).addScaledVector(er, -0.20);
      rootGroup.add(labelBigR);

      // 4. 左图 3D 环上仅显示主电流元 Q1（左图不增加对称电流元）
      const ptQ1 = new THREE.Vector3(0, a * Math.cos(thetaQ), -a * Math.sin(thetaQ));
      const tanQ1 = new THREE.Vector3(0, -Math.sin(thetaQ), -Math.cos(thetaQ)).normalize();

      const q1Mesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.055, 16, 16),
        new THREE.MeshBasicMaterial({ color: COLORS.a })
      );
      q1Mesh.position.copy(ptQ1);
      rootGroup.add(q1Mesh);

      // Q1 处顺时针切向电流箭头
      rootGroup.add(createCustomArrow(tanQ1, ptQ1, 0.44, COLORS.wire, 0.13, 0.045, 0.013, 1.0));

      // 【翠绿色粗虚线】半径 a (O -> Q1，与 r' 同样粗的虚线)
      rootGroup.add(createThickDashedSegment(origin, ptQ1, COLORS.a, LINE_RADIUS, 0.095, 0.06));
      // 【醒目红色实线】距离 r' (Q1 -> P，solid 红色实线)
      rootGroup.add(createSolidSegment(ptQ1, ptP, COLORS.rprime, LINE_RADIUS, 1.0));

      // 夹角 φ 圆弧与标签
      if (Math.abs(Math.sin(phi)) > 0.03) {
        const arcPts = [];
        const arcR = a * 0.36;
        const steps = 28;
        for (let i = 0; i <= steps; i++) {
          const u = (i / steps) * phi;
          arcPts.push(
            new THREE.Vector3()
              .addScaledVector(er, arcR * Math.cos(u))
              .addScaledVector(ephi, arcR * Math.sin(u))
          );
        }
        rootGroup.add(new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(arcPts),
          new THREE.LineBasicMaterial({ color: COLORS.phi })
        ));
      }
      const labelPhi = makeLabelSprite('φ', '#c084fc', 36);
      labelPhi.position
        .addScaledVector(er, a * 0.46 * Math.cos(phi * 0.5))
        .addScaledVector(ephi, a * 0.46 * Math.sin(phi * 0.5));
      rootGroup.add(labelPhi);

      const labelA = makeLabelSprite('a', '#10b981', 38);
      labelA.position.copy(ptQ1).multiplyScalar(0.54).add(new THREE.Vector3(-0.14, 0.08, 0));
      rootGroup.add(labelA);

      const midRPrime = new THREE.Vector3().lerpVectors(ptQ1, ptP, 0.48);
      const labelRPrime = makeLabelSprite("r'", '#f43f5e', 38);
      labelRPrime.position.copy(midRPrime).addScaledVector(er, 0.19);
      rootGroup.add(labelRPrime);

      // 5. 左图 3D 场点 P 处的元矢势箭头（随电流元 φ 与 1/r'(φ) 动态变化，左图不加对称元）
      const rPrimeLen = ptQ1.distanceTo(ptP);
      const dALen = Math.min(0.92, Math.max(0.32, 1.50 / rPrimeLen));
      rootGroup.add(createCustomArrow(tanQ1, ptP, dALen, COLORS.vecA, 0.14, 0.048, 0.015, 1.0));

      const labelVecA = makeLabelSprite('A', '#22d3ee', 36);
      labelVecA.position.copy(ptP).addScaledVector(tanQ1, dALen + 0.17);
      rootGroup.add(labelVecA);

      // 更新右侧大幅 2D 投影图标题与画布
      const absPhiDeg = Math.round((Math.abs(phi) * 180) / Math.PI);
      document.getElementById('proj-phi-txt').innerText = showSymInProjection
        ? `±φ = ±${absPhiDeg}°`
        : `φ = ${phiDegNorm}°`;

      drawRightProjectionCanvas(a, r, phi, rPrimeLen, showSymInProjection);
    }

    /* ==============================================================
       5. 右半屏：与左图等大的 2D 线圈平面投影图
       ============================================================== */
    const projCanvas = document.getElementById('proj-canvas');
    const projCtx = projCanvas.getContext('2d');

    function drawRightProjectionCanvas(a, r, phi, rPrimeLen, showSym) {
      const W = projCanvas.width;
      const H = projCanvas.height;
      const cx = W * 0.5;
      const cy = H * 0.60;
      const scale = 172;
      const LINE_W = 4.2; // r'、a、OP 统一的醒目线宽

      projCtx.clearRect(0, 0, W, H);

      // 背景淡坐标格
      projCtx.strokeStyle = 'rgba(148, 163, 184, 0.08)';
      projCtx.lineWidth = 1;
      for (let x = 0; x <= W; x += 40) {
        projCtx.beginPath(); projCtx.moveTo(x, 0); projCtx.lineTo(x, H); projCtx.stroke();
      }
      for (let y = 0; y <= H; y += 40) {
        projCtx.beginPath(); projCtx.moveTo(0, y); projCtx.lineTo(W, y); projCtx.stroke();
      }

      // 十字坐标轴
      projCtx.strokeStyle = 'rgba(148, 163, 184, 0.42)';
      projCtx.lineWidth = 1.8;
      projCtx.beginPath();
      projCtx.moveTo(28, cy); projCtx.lineTo(W - 28, cy);
      projCtx.moveTo(cx, 28); projCtx.lineTo(cx, H - 28);
      projCtx.stroke();

      const Rpx = a * scale;
      const rFieldPx = Math.min(cy - 108, Math.max(80, r * scale));

      // 银色圆形导线环 (半径 a)
      projCtx.strokeStyle = '#e2e8f0';
      projCtx.lineWidth = 4.4;
      projCtx.beginPath();
      projCtx.arc(cx, cy, Rpx, 0, Math.PI * 2);
      projCtx.stroke();

      // 主源点 Q1 坐标 (cx + Rpx sinφ, cy - Rpx cosφ)
      const q1x = cx + Rpx * Math.sin(phi);
      const q1y = cy - Rpx * Math.cos(phi);

      // 对称源点 Q2 坐标 (cx - Rpx sinφ, cy - Rpx cosφ)
      const q2x = cx - Rpx * Math.sin(phi);
      const q2y = cy - Rpx * Math.cos(phi);

      // 场点投影坐标 P (cx, py)
      const px = cx;
      const py = cy - rFieldPx;

      const tanLen = 74;

      // 对称电流元 Q2 (-φ)：仅在投影图中根据按键开关显示（半透明浅色）
      if (showSym) {
        projCtx.save();
        projCtx.globalAlpha = 0.38;

        // Q2 的翠绿色虚线半径 a（与主半径同粗）
        projCtx.save();
        projCtx.setLineDash([12, 8]);
        projCtx.strokeStyle = '#10b981';
        projCtx.lineWidth = LINE_W;
        projCtx.beginPath();
        projCtx.moveTo(cx, cy);
        projCtx.lineTo(q2x, q2y);
        projCtx.stroke();
        projCtx.restore();

        // -φ 圆弧
        projCtx.strokeStyle = '#c084fc';
        projCtx.lineWidth = 2.8;
        projCtx.beginPath();
        projCtx.arc(cx, cy, Rpx * 0.36, -Math.PI / 2, -Math.PI / 2 - phi, phi > 0);
        projCtx.stroke();
        projCtx.fillStyle = '#c084fc';
        projCtx.font = 'italic bold 28px "Times New Roman", serif';
        projCtx.fillText('-φ', cx - 48, cy - Rpx * 0.42);

        // Q2 切向电流箭头
        drawCanvasArrow(projCtx, q2x, q2y, q2x + tanLen * Math.cos(-phi), q2y + tanLen * Math.sin(-phi), '#e2e8f0', 3.4);
        projCtx.fillStyle = '#10b981';
        projCtx.beginPath();
        projCtx.arc(q2x, q2y, 7.5, 0, Math.PI * 2);
        projCtx.fill();

        projCtx.restore();
      }

      // 【翠绿色粗虚线】主半径 a (O -> Q1)
      projCtx.save();
      projCtx.setLineDash([12, 8]);
      projCtx.strokeStyle = '#10b981';
      projCtx.lineWidth = LINE_W;
      projCtx.beginPath();
      projCtx.moveTo(cx, cy);
      projCtx.lineTo(q1x, q1y);
      projCtx.stroke();
      projCtx.restore();

      // 半径 a 标签
      projCtx.fillStyle = '#10b981';
      projCtx.font = 'italic bold 30px "Times New Roman", serif';
      projCtx.fillText('a', cx + Rpx * 0.52 * Math.sin(phi) + 16, cy - Rpx * 0.52 * Math.cos(phi) + 18);

      // φ 角扇形圆弧与标签
      projCtx.strokeStyle = '#c084fc';
      projCtx.lineWidth = 3.0;
      projCtx.beginPath();
      projCtx.arc(cx, cy, Rpx * 0.36, -Math.PI / 2, -Math.PI / 2 + phi, phi < 0);
      projCtx.stroke();
      projCtx.fillStyle = '#c084fc';
      projCtx.font = 'italic bold 30px "Times New Roman", serif';
      projCtx.fillText('φ', cx + 16, cy - Rpx * 0.42);

      // Q1 处顺时针切向电流箭头
      const tx = q1x + tanLen * Math.cos(phi);
      const ty = q1y + tanLen * Math.sin(phi);
      drawCanvasArrow(projCtx, q1x, q1y, tx, ty, '#e2e8f0', 3.6);

      projCtx.fillStyle = '#10b981';
      projCtx.beginPath();
      projCtx.arc(q1x, q1y, 7.8, 0, Math.PI * 2);
      projCtx.fill();

      // 圆心 O 标签
      projCtx.fillStyle = '#e2e8f0';
      projCtx.font = 'italic bold 26px "Times New Roman", serif';
      projCtx.fillText('O', cx - 28, cy + 28);

      // 顶部场点 P 处：绘制随 φ 与 1/r'(φ) 动态变化的 dA1、对称元 dA2（若开启）、正交投影虚线与径向抵消分量
      const dApx = Math.min(100, Math.max(40, 180 / rPrimeLen));
      // dA1 平行于 Q1 切向：(cosφ, +sinφ)
      const da1x = px + dApx * Math.cos(phi);
      const da1y = py + dApx * Math.sin(phi);
      // dA2 平行于 Q2 切向：(cosφ, -sinφ)
      const da2x = px + dApx * Math.cos(phi);
      const da2y = py - dApx * Math.sin(phi);

      // 投影矩形虚线：水平虚线（投向径向轴）用珊瑚粉，竖直虚线（投向切向轴）用亮黄色
      projCtx.save();
      projCtx.setLineDash([6, 6]);
      projCtx.lineWidth = 2.0;
      // 投向径向轴的水平虚线
      projCtx.strokeStyle = 'rgba(251, 113, 133, 0.72)';
      projCtx.beginPath();
      projCtx.moveTo(da1x, da1y);
      projCtx.lineTo(px, da1y);
      if (showSym) {
        projCtx.moveTo(da2x, da2y);
        projCtx.lineTo(px, da2y);
      }
      projCtx.stroke();

      // 投向切向轴的竖直虚线
      projCtx.strokeStyle = 'rgba(250, 204, 21, 0.78)';
      projCtx.beginPath();
      projCtx.moveTo(da1x, da1y);
      projCtx.lineTo(da1x, py);
      if (showSym) {
        projCtx.moveTo(da2x, da2y);
        projCtx.lineTo(da2x, py);
      }
      projCtx.stroke();
      projCtx.restore();

      // 径向分量 dA_1r (向下) 与对称径向分量 dA_2r (向上，半透明) —— 等大反向相消！
      if (Math.abs(Math.sin(phi)) > 0.06) {
        drawCanvasArrow(projCtx, px, py, px, da1y, '#fb7185', 3.4);
        drawSubscriptLabel(projCtx, 'dA', '1r', px - 52, da1y + (da1y >= py ? 6 : -4), '#fb7185');

        if (showSym) {
          projCtx.save();
          projCtx.globalAlpha = 0.45;
          drawCanvasArrow(projCtx, px, py, px, da2y, '#fb7185', 3.4);
          drawSubscriptLabel(projCtx, 'dA', '2r', px - 52, da2y + (da2y >= py ? 6 : -4), '#fb7185');
          projCtx.restore();
        }
      }

      // 对称元 dA2 箭头（半透明浅青色 #22d3ee）
      if (showSym) {
        projCtx.save();
        projCtx.globalAlpha = 0.42;
        drawCanvasArrow(projCtx, px, py, da2x, da2y, '#22d3ee', 3.2);
        drawSubscriptLabel(projCtx, 'dA', '2', da2x + 10, da2y - 6, '#22d3ee');
        projCtx.restore();
      }

      // 主元 dA1 箭头（原有的亮青色 #22d3ee 不变）
      drawCanvasArrow(projCtx, px, py, da1x, da1y, '#22d3ee', 3.4);
      drawSubscriptLabel(projCtx, 'dA', '1', da1x + 10, da1y + 18, '#22d3ee');

      // 沿切线方向的投影分量 dA_φ（去掉多余的紫红色箭头，仅保留刚好对齐竖直投影虚线的黄色切向分量箭头 #facc15）
      if (Math.abs(da1x - px) > 5) {
        drawCanvasArrow(projCtx, px, py, da1x, py, '#facc15', 3.8);
        drawSubscriptLabel(projCtx, 'dA', 'φ', da1x + (da1x >= px ? 10 : -46), py + 7, '#facc15');
      }

      projCtx.fillStyle = '#ffffff';
      projCtx.beginPath();
      projCtx.arc(px, py, 8, 0, Math.PI * 2);
      projCtx.fill();
      projCtx.fillStyle = '#ffffff';
      projCtx.font = 'italic bold 26px "Times New Roman", serif';
      projCtx.fillText('P', px - 30, py - 14);
    }

    // 绘制带紧凑下标的斜体数学符号（避免 Unicode 下标间距断裂或出现下划线 _）
    function drawSubscriptLabel(ctx, mainText, subText, x, y, color) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.font = 'italic bold 23px "Times New Roman", serif';
      ctx.fillText(mainText, x, y);
      const mainW = ctx.measureText(mainText).width;
      ctx.font = 'italic bold 16px "Times New Roman", serif';
      ctx.fillText(subText, x + mainW + 1, y + 5);
      ctx.restore();
    }

    function drawCanvasArrow(ctx, x1, y1, x2, y2, color, width) {
      const headLen = 14;
      const ang = Math.atan2(y2 - y1, x2 - x1);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.lineTo(x2 - headLen * Math.cos(ang - Math.PI / 6), y2 - headLen * Math.sin(ang - Math.PI / 6));
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - headLen * Math.cos(ang + Math.PI / 6), y2 - headLen * Math.sin(ang + Math.PI / 6));
      ctx.stroke();
    }

    /* ==============================================================
       6. 视角切换、随机变换 P 点、变换电流元位置、循环电流元 φ、切换对称电流元
       ============================================================== */
    let currentViewMode = 'SIDE';
    let camAnimId = null;

    function getSideViewState() {
      // 严格正视侧视图（对应教材左图视角）：
      // 环平面在 YZ 面，中心对称轴沿 +X 轴水平向右，+Y 轴严格竖直向上，+Z 轴沿视线朝外
      // 此时交叉参考虚线：X 轴（中心轴线）严格水平，Y 轴严格竖直，Z 轴沿视线方向
      const target = new THREE.Vector3(params.z * 0.42, params.r * 0.35, 0);
      const pos = new THREE.Vector3(params.z * 0.42, params.r * 0.35, 7.2);
      const up = new THREE.Vector3(0, 1, 0);
      return { pos, target, up };
    }

    // 页面初始即设为左图（子午面侧视）视角
    {
      const initCam = getSideViewState();
      camera.position.copy(initCam.pos);
      controls.target.copy(initCam.target);
      camera.up.copy(initCam.up);
      controls.update();
    }

    function setCameraPreset(mode) {
      currentViewMode = mode;
      document.getElementById('btn-view-ring').classList.toggle('active', mode === 'RING');
      document.getElementById('btn-view-side').classList.toggle('active', mode === 'SIDE');

      let endPos, endTarget, endUp;
      if (mode === 'RING') {
        // 对着圆环看（在左半屏视口中正对圆环中心观察）
        endTarget = new THREE.Vector3(0, 0, 0);
        endPos = new THREE.Vector3(6.8, 0, 0);
        endUp = new THREE.Vector3(0, 1, 0);
      } else if (mode === 'SIDE') {
        // 重置为左图视角（垂直于场点子午面侧视）
        const sideState = getSideViewState();
        endPos = sideState.pos;
        endTarget = sideState.target;
        endUp = sideState.up;
      }

      if (camAnimId) cancelAnimationFrame(camAnimId);
      const startPos = camera.position.clone();
      const startTarget = controls.target.clone();
      const startUp = camera.up.clone();
      let u = 0;

      function step() {
        u += 0.05;
        const t = Math.min(1, 0.5 - 0.5 * Math.cos(u * Math.PI));
        camera.position.lerpVectors(startPos, endPos, t);
        controls.target.lerpVectors(startTarget, endTarget, t);
        camera.up.lerpVectors(startUp, endUp, t).normalize();
        controls.update();
        if (u < 1) camAnimId = requestAnimationFrame(step);
      }
      step();
    }

    // 重置按键：同时重置相机视角与 P 点初始位置（角度恢复为 20°）
    function resetAll() {
      params.z = 2.10;
      params.r = 1.45;
      params.thetaPDeg = 20;
      params.thetaQDeg = 60;
      updateScene();
      setCameraPreset('SIDE');
    }

    // 随机变换空间所求点 P 的位置 (z, r, θ_P)：保持圆环与所取电流元 Q1 完全静止
    function randomizePointP() {
      const randZ = +(1.1 + Math.random() * 1.9).toFixed(2);
      const randR = +(0.65 + Math.random() * 1.35).toFixed(2);
      const signs = [-1, 1];
      const sign = signs[Math.floor(Math.random() * 2)];
      const randThetaP = sign * Math.floor(25 + Math.random() * 120);

      params.z = randZ;
      params.r = randR;
      params.thetaPDeg = randThetaP;

      updateScene();
    }

    // 随机变换环上所取电流元 Q1 的位置（保持场点 P 与圆环不动）
    function randomizeCurrentElement() {
      if (isSweepingPhi) toggleSweepPhi();
      const delta = 40 + Math.floor(Math.random() * 280);
      params.thetaQDeg = (params.thetaQDeg + delta) % 360;
      updateScene();
    }

    // 循环环上电流元 φ
    function toggleSweepPhi() {
      isSweepingPhi = !isSweepingPhi;
      const btn = document.getElementById('btn-sweep-phi');
      btn.classList.toggle('active', isSweepingPhi);
      btn.innerHTML = isSweepingPhi
        ? '<span>⏸️ 暂停循环</span>'
        : '<span>🔄 循环电流元 φ</span>';
    }

    // 切换显示/隐藏对称电流元 (-φ)（仅在右侧投影图中显示，左图不增加）
    function toggleSymmetricElement() {
      showSymInProjection = !showSymInProjection;
      const btn = document.getElementById('btn-toggle-sym');
      btn.classList.toggle('active', showSymInProjection);
      btn.innerHTML = showSymInProjection
        ? '<span>🌗 隐藏对称电流元 (-φ)</span>'
        : '<span>🌗 显示对称电流元 (-φ)</span>';
      updateScene();
    }

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    /* ==============================================================
       7. 初始化与渲染循环
       ============================================================== */
    updateScene();

    function animate() {
      requestAnimationFrame(animate);

      if (isSweepingPhi) {
        params.thetaQDeg = (params.thetaQDeg + 1) % 360;
        updateScene();
      }

      controls.update();
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);
  </script>
