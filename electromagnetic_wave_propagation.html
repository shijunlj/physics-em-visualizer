<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>电磁波传播</title>
  <style>
    :root {
      color-scheme: dark;
      --text: #f2f6ff;
      --muted: #bacbe2;
      --electric: #78b9ff;
      --magnetic: #ff818e;
      --accent: #76e8cf;
      --crest: #ffd071;
      --border: rgba(151, 178, 218, 0.23);
      --home-bottom: max(12px, env(safe-area-inset-bottom));
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 760px 480px at 8% 0%, #342e58, transparent 78%),
        radial-gradient(ellipse 680px 520px at 100% 22%, #1b3d4e, transparent 82%),
        #152239;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(1120px, calc(100% - 40px));
      margin: auto;
      padding: clamp(26px, 6vh, 68px) 0 calc(var(--home-bottom) + 52px);
    }

    h1 { margin: 0 0 9px; font-size: clamp(28px, 5vw, 44px); font-weight: 700; letter-spacing: 0.04em; line-height: 1.2; }
    header p { margin: 0 0 25px; color: var(--muted); font-size: 15px; line-height: 1.65; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(238px, 268px); align-items: stretch; gap: 16px; }
    .scene, .panel {
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: linear-gradient(155deg, #223450, #18283e 75%);
      box-shadow: 0 16px 38px rgba(7, 14, 29, 0.24);
    }

    .scene { display: flex; flex-direction: column; overflow: hidden; }
    .toolbar, .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 13px 16px;
    }

    button {
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #20314b;
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
    }

    button:hover { background: #334e70; }
    #play { min-width: 62px; color: #132d2c; background: var(--accent); font-weight: 650; }
    #play:hover { background: #a0f1df; }
    :is(button, input, a, canvas):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    canvas:focus-visible { outline-offset: -3px; }
    .time {
      margin-left: auto;
      padding: 5px 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #142339;
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    canvas {
      display: block;
      flex: 1 0 auto;
      width: 100%;
      height: clamp(310px, 53vh, 520px);
      border-block: 1px solid var(--border);
      background:
        radial-gradient(circle, rgba(143, 178, 227, 0.18) 0.8px, transparent 1px) center / 24px 24px,
        radial-gradient(ellipse at 45% 48%, #1b3453, #0e192d 80%);
      cursor: grab;
      touch-action: none;
    }

    canvas:active { cursor: grabbing; }
    .legend { gap: 9px 19px; font-size: 13px; }
    .legend span { display: inline-flex; align-items: center; gap: 7px; }
    .legend span::before { content: ""; width: 15px; border-top: 2px solid currentColor; border-radius: 2px; }
    .electric { color: var(--electric); }
    .magnetic { color: var(--magnetic); }
    .legend .propagation { color: var(--accent); }
    .legend .crest { color: var(--crest); }
    .legend .crest::before { width: 7px; height: 7px; border: 0; border-radius: 50%; background: currentColor; }

    .panel { padding: 18px; }
    .panel h2 { margin: 0 0 8px; font-size: 18px; }
    .panel p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .controls { display: grid; gap: 15px; margin: 17px 0; }
    .control { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 6px; }
    label { font-size: 14px; }
    output { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
    input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); }
    .readings { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0 0; }
    .reading { padding: 9px 10px; border: 1px solid var(--border); border-radius: 9px; font-size: 14px; }
    .reading.electric { background: rgba(120, 185, 255, 0.08); border-color: rgba(120, 185, 255, 0.28); }
    .reading.magnetic { background: rgba(255, 129, 142, 0.08); border-color: rgba(255, 129, 142, 0.28); }
    .reading strong { display: block; margin-top: 3px; font-size: 23px; line-height: 1.15; font-variant-numeric: tabular-nums; }
    .field-note { padding-top: 12px; border-top: 1px solid var(--border); }
    .panel .equation { color: var(--text); margin-bottom: 5px; font-size: 15px; }

    .home-link {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: var(--home-bottom);
      z-index: 30;
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid #526582;
      border-radius: 8px;
      background: #22304a;
      color: var(--accent);
      font-size: 13px;
      text-decoration: none;
    }

    .home-link:hover { text-decoration: underline; }

    @media (max-width: 760px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      main { width: calc(100% - 24px); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>电磁波传播</h1>
      <p>真空中的线偏振平面波。电场 E、磁场 H 和传播方向两两垂直。</p>
    </header>

    <div class="layout">
      <section class="scene" aria-label="电磁波三维动画">
        <div class="toolbar">
          <button id="play" type="button">播放</button>
          <button id="reset" type="button">重置</button>
          <span class="time"><var>t</var>/<var>T</var> = <span id="time">0.00</span></span>
        </div>
        <canvas id="wave" tabindex="0" aria-label="电磁波三维图。拖动或用方向键旋转视角，双指捏合缩放模型。"></canvas>
        <div class="legend">
          <span class="electric">电场 E</span>
          <span class="magnetic">磁场 H</span>
          <span class="propagation">传播方向</span>
          <span class="crest">跟踪的波峰</span>
        </div>
      </section>

      <aside class="panel" aria-label="观察点与播放设置">
        <h2>观察点 P</h2>
        <p>播放时，金色标记随波峰前进，P 留在选定位置。拖动换视角，双指捏合缩放模型。</p>
        <div class="readings">
          <div class="reading electric"><var>E</var>/<var>E</var><sub>0</sub><strong id="electric-value">+1.00</strong></div>
          <div class="reading magnetic"><var>H</var>/<var>H</var><sub>0</sub><strong id="magnetic-value">+1.00</strong></div>
        </div>
        <div class="controls">
          <div class="control">
            <label for="probe">位置 <var>x</var></label>
            <output id="probe-value" for="probe">1.00 λ</output>
            <input id="probe" type="range" min="0" max="2.5" step="0.01" value="1">
          </div>
          <div class="control">
            <label for="speed">播放速度</label>
            <output id="speed-value" for="speed">1.00×</output>
            <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1">
          </div>
          <div class="control">
            <label for="zoom">模型缩放</label>
            <output id="zoom-value" for="zoom">1.00×</output>
            <input id="zoom" type="range" min="0.5" max="2.5" step="0.01" value="1">
          </div>
        </div>
        <div class="field-note">
          <p class="equation"><var>E</var>/<var>E</var><sub>0</sub> = <var>H</var>/<var>H</var><sub>0</sub><br>= cos[2π(<var>x</var>/λ − <var>t</var>/<var>T</var>)]</p>
          <p>两场分别按各自的峰值归一化。在 P 点，它们同时过零、同时达到峰值。</p>
        </div>
      </aside>
    </div>
  </main>
  <a class="home-link" href="./index.html">← 返回主页</a>

  <script>
    const canvas = document.getElementById('wave');
    const ctx = canvas.getContext('2d');
    const play = document.getElementById('play');
    const timeLabel = document.getElementById('time');
    const probe = document.getElementById('probe');
    const speed = document.getElementById('speed');
    const zoomControl = document.getElementById('zoom');
    const probeLabel = document.getElementById('probe-value');
    const speedLabel = document.getElementById('speed-value');
    const zoomLabel = document.getElementById('zoom-value');
    const electricLabel = document.getElementById('electric-value');
    const magneticLabel = document.getElementById('magnetic-value');
    const styles = getComputedStyle(document.documentElement);
    const electric = styles.getPropertyValue('--electric').trim();
    const magnetic = styles.getPropertyValue('--magnetic').trim();
    const accent = styles.getPropertyValue('--accent').trim();
    const crestColor = styles.getPropertyValue('--crest').trim();
    const length = Number(probe.max);
    const crestCycle = Math.ceil(length);
    const unitsPerWavelength = 4;
    const halfLength = length * unitsPerWavelength / 2;
    const fieldAmplitude = 1.25;
    const planeEdge = 1.55;
    const axisEnd = halfLength + 0.65;
    const tau = 2 * Math.PI;
    const defaultYaw = 1.01;
    const defaultElevation = 0.42;
    const sinYaw = Math.sin(defaultYaw);
    const cosYaw = Math.cos(defaultYaw);
    const sinElevation = Math.sin(defaultElevation);
    const cosElevation = Math.cos(defaultElevation);
    // The world x, y and z axes expressed in screen-right, screen-up and depth coordinates.
    const initialView = [
      [sinYaw, -cosYaw * sinElevation, cosYaw * cosElevation],
      [cosYaw, sinYaw * sinElevation, -sinYaw * cosElevation],
      [0, cosElevation, sinElevation]
    ];
    const sceneRadius = Math.max(axisEnd, Math.hypot(halfLength, planeEdge));
    let width = 0;
    let height = 0;
    let fitScale = 0;
    let zoom = zoomControl.valueAsNumber;
    let time = 0;
    let view = initialView;
    let frame = null;
    let lastFrame = null;
    let drag = null;
    const pointers = new Map();
    let pinch = null;
    let gestureZoom = null;

    function field(x) {
      return Math.cos(tau * (x - time % 1));
    }

    function draw() {
      const scale = fitScale * zoom;
      if (scale <= 0) return;
      ctx.clearRect(0, 0, width, height);
      const [xAxis, yAxis, zAxis] = view;

      function project(x, y = 0, z = 0) {
        return [
          width / 2 + scale * (x * xAxis[0] + y * yAxis[0] + z * zAxis[0]),
          height / 2 - scale * (x * xAxis[1] + y * yAxis[1] + z * zAxis[1])
        ];
      }

      function path(points) {
        ctx.beginPath();
        ctx.moveTo(...project(...points[0]));
        for (const point of points.slice(1)) ctx.lineTo(...project(...point));
      }

      function plane(pointAt, fill, border) {
        path([
          pointAt(-halfLength, -planeEdge), pointAt(halfLength, -planeEdge),
          pointAt(halfLength, planeEdge), pointAt(-halfLength, planeEdge)
        ]);
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.strokeStyle = border;
        ctx.lineWidth = 1;
        ctx.fill();
        ctx.stroke();
      }

      const electricPoint = (x, amplitude) => [x, amplitude, 0];
      const magneticPoint = (x, amplitude) => [x, 0, amplitude];
      plane(electricPoint, 'rgba(86, 151, 244, 0.10)', 'rgba(120, 185, 255, 0.24)');
      plane(magneticPoint, 'rgba(255, 101, 124, 0.085)', 'rgba(255, 129, 142, 0.25)');

      function arrow(from, to, color, lineWidth, headSize) {
        const [x0, y0] = project(...from);
        const [x1, y1] = project(...to);
        const size = Math.min(headSize, Math.hypot(x1 - x0, y1 - y0) * 0.5);
        if (size < 1) return;
        const angle = Math.atan2(y1 - y0, x1 - x0);
        ctx.strokeStyle = color;
        ctx.lineWidth = lineWidth;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.moveTo(x1 - size * Math.cos(angle - 0.48), y1 - size * Math.sin(angle - 0.48));
        ctx.lineTo(x1, y1);
        ctx.lineTo(x1 - size * Math.cos(angle + 0.48), y1 - size * Math.sin(angle + 0.48));
        ctx.stroke();
      }

      arrow([-halfLength - 0.25, 0, 0], [axisEnd, 0, 0], accent, 1.6, 10);
      ctx.fillStyle = accent;
      ctx.font = '600 14px system-ui, sans-serif';
      ctx.textAlign = 'center';
      const [axisX, axisY] = project(axisEnd);
      ctx.save();
      ctx.font = 'italic 600 15px system-ui, sans-serif';
      ctx.fillText('k', axisX, axisY - 9);
      const vectorY = axisY - 23;
      ctx.strokeStyle = accent;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(axisX - 5, vectorY);
      ctx.lineTo(axisX + 5, vectorY);
      ctx.moveTo(axisX + 2, vectorY - 2);
      ctx.lineTo(axisX + 5, vectorY);
      ctx.lineTo(axisX + 2, vectorY + 2);
      ctx.stroke();
      ctx.restore();

      function plotField(pointAt, color) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.28;
        ctx.beginPath();
        for (let i = 0; i <= 64; i++) {
          const x = length * i / 64;
          const axis = x * unitsPerWavelength - halfLength;
          ctx.moveTo(...project(axis));
          ctx.lineTo(...project(...pointAt(axis, fieldAmplitude * field(x))));
        }
        ctx.stroke();
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        for (let i = 0; i <= 200; i++) {
          const x = length * i / 200;
          const tip = pointAt(x * unitsPerWavelength - halfLength, fieldAmplitude * field(x));
          ctx.lineTo(...project(...tip));
        }
        ctx.globalAlpha = 0.15;
        ctx.lineWidth = 6;
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }

      plotField(electricPoint, electric);
      plotField(magneticPoint, magnetic);

      // A marked crest enters at x = 0, then leaves before the next one is marked.
      const crestLocation = time % crestCycle;
      if (crestLocation <= length) {
        const crestX = crestLocation * unitsPerWavelength - halfLength;
        const crestTips = [electricPoint(crestX, fieldAmplitude), magneticPoint(crestX, fieldAmplitude)];
        path([crestTips[0], [crestX, 0, 0], crestTips[1]]);
        ctx.strokeStyle = crestColor;
        ctx.lineWidth = 1.4;
        ctx.setLineDash([3, 4]);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = crestColor;
        ctx.strokeStyle = '#101b2f';
        ctx.lineWidth = 1.8;
        for (const tip of crestTips) {
          const [x, y] = project(...tip);
          ctx.beginPath();
          ctx.arc(x, y, 5, 0, tau);
          ctx.fill();
          ctx.stroke();
        }
      }

      const location = probe.valueAsNumber;
      const probeX = location * unitsPerWavelength - halfLength;
      const a = fieldAmplitude * field(location);
      path([
        [probeX, -planeEdge, 0], [probeX, 0, planeEdge],
        [probeX, planeEdge, 0], [probeX, 0, -planeEdge]
      ]);
      ctx.closePath();
      ctx.setLineDash([3, 5]);
      ctx.strokeStyle = '#dce9ff';
      ctx.globalAlpha = 0.56;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.setLineDash([]);
      arrow([probeX, 0, 0], electricPoint(probeX, a), electric, 3.2, 11);
      arrow([probeX, 0, 0], magneticPoint(probeX, a), magnetic, 3.2, 11);
      const [px, py] = project(probeX);
      ctx.fillStyle = '#f5f8ff';
      ctx.beginPath();
      ctx.arc(px, py, 3.7, 0, tau);
      ctx.fill();
      ctx.textAlign = 'left';
      ctx.fillText('P', px + 7, py + 15);
    }

    function render() {
      timeLabel.textContent = time.toFixed(2);
      const value = field(probe.valueAsNumber);
      const reading = Math.abs(value) < 0.005 ? '0.00' : (value > 0 ? '+' : '') + value.toFixed(2);
      electricLabel.textContent = reading;
      magneticLabel.textContent = reading;
      draw();
    }

    function pause() {
      if (frame !== null) cancelAnimationFrame(frame);
      frame = null;
      lastFrame = null;
      play.textContent = '播放';
    }

    function animate(timestamp) {
      if (lastFrame !== null) time += (timestamp - lastFrame) * speed.valueAsNumber / 2800;
      lastFrame = timestamp;
      render();
      frame = requestAnimationFrame(animate);
    }

    play.addEventListener('click', () => {
      if (frame !== null) {
        pause();
      } else {
        play.textContent = '暂停';
        frame = requestAnimationFrame(animate);
      }
    });

    function updateControls() {
      probeLabel.value = probe.valueAsNumber.toFixed(2) + ' λ';
      speedLabel.value = speed.valueAsNumber.toFixed(2) + '×';
      render();
    }

    function setZoom(value) {
      zoom = Math.max(Number(zoomControl.min), Math.min(Number(zoomControl.max), value));
      zoomControl.value = zoom;
      zoomLabel.value = zoom.toFixed(2) + '×';
      if (frame === null) draw();
    }

    probe.addEventListener('input', updateControls);
    speed.addEventListener('input', updateControls);
    zoomControl.addEventListener('input', () => setZoom(zoomControl.valueAsNumber));
    document.getElementById('reset').addEventListener('click', () => {
      pause();
      time = 0;
      view = initialView;
      drag = null;
      pointers.clear();
      pinch = null;
      gestureZoom = null;
      probe.value = probe.defaultValue;
      speed.value = speed.defaultValue;
      setZoom(Number(zoomControl.defaultValue));
      updateControls();
    });

    function dot(a, b) {
      return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    }

    function cross(a, b) {
      return [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0]
      ];
    }

    function rotateView(startView, axis, angle) {
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);
      view = startView.map(vector => {
        const tangent = cross(axis, vector);
        const parallel = dot(axis, vector);
        return vector.map((value, i) => value * cos + tangent[i] * sin + axis[i] * parallel * (1 - cos));
      });
      if (frame === null) draw();
    }

    function trackballPoint(event, centerX, centerY, radius) {
      const x = (event.clientX - centerX) / radius;
      const y = (centerY - event.clientY) / radius;
      const distanceSquared = x * x + y * y;
      // A smooth extension of the sphere keeps drags outside its central area responsive.
      const z = distanceSquared <= 0.5 ? Math.sqrt(1 - distanceSquared) : 0.5 / Math.sqrt(distanceSquared);
      const length = Math.hypot(x, y, z);
      return [x / length, y / length, z / length];
    }

    function beginDrag(event) {
      const rect = canvas.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const radius = Math.min(rect.width, rect.height) * 0.55;
      if (radius <= 0) return;
      drag = {
        id: event.pointerId, centerX, centerY, radius, view,
        start: trackballPoint(event, centerX, centerY, radius)
      };
    }

    function pointerDistance() {
      const [first, second] = pointers.values();
      return Math.hypot(first.clientX - second.clientX, first.clientY - second.clientY);
    }

    canvas.addEventListener('pointerdown', event => {
      if (event.button !== 0 || pointers.size >= 2) return;
      if (pointers.size > 0 &&
          (event.pointerType !== 'touch' || pointers.values().next().value.pointerType !== 'touch')) return;
      pointers.set(event.pointerId, event);
      canvas.setPointerCapture(event.pointerId);
      if (pointers.size === 2) {
        drag = null;
        pinch = { distance: Math.max(pointerDistance(), 1), zoom };
      } else {
        beginDrag(event);
      }
    });
    canvas.addEventListener('pointermove', event => {
      if (!pointers.has(event.pointerId)) return;
      pointers.set(event.pointerId, event);
      if (pinch) {
        setZoom(pinch.zoom * pointerDistance() / pinch.distance);
        return;
      }
      if (event.pointerId !== drag?.id) return;
      const point = trackballPoint(event, drag.centerX, drag.centerY, drag.radius);
      const axis = cross(drag.start, point);
      const axisLength = Math.hypot(...axis);
      if (axisLength < 1e-9) {
        view = drag.view;
        if (frame === null) draw();
        return;
      }
      rotateView(drag.view, axis.map(value => value / axisLength), Math.atan2(axisLength, dot(drag.start, point)));
    });
    function endPointer(event) {
      if (!pointers.delete(event.pointerId)) return;
      drag = null;
      pinch = null;
      if (pointers.size === 1) beginDrag(pointers.values().next().value);
    }

    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
    canvas.addEventListener('lostpointercapture', endPointer);

    canvas.addEventListener('wheel', event => {
      if (!event.ctrlKey && !event.metaKey) return;
      event.preventDefault();
      if (gestureZoom !== null || pinch) return;
      const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? height : 1;
      setZoom(zoom * Math.exp(-event.deltaY * unit * 0.01));
    }, { passive: false });

    // Safari can report trackpad pinches as gesture events instead of wheel events.
    canvas.addEventListener('gesturestart', event => {
      event.preventDefault();
      gestureZoom = pointers.size === 0 ? zoom : null;
    }, { passive: false });
    canvas.addEventListener('gesturechange', event => {
      event.preventDefault();
      if (gestureZoom !== null && pointers.size === 0) setZoom(gestureZoom * event.scale);
    }, { passive: false });
    canvas.addEventListener('gestureend', event => {
      event.preventDefault();
      gestureZoom = null;
    }, { passive: false });
    canvas.addEventListener('keydown', event => {
      const directions = {
        ArrowLeft: [[0, 1, 0], -0.15], ArrowRight: [[0, 1, 0], 0.15],
        ArrowUp: [[1, 0, 0], -0.12], ArrowDown: [[1, 0, 0], 0.12]
      };
      const direction = directions[event.key];
      if (!Array.isArray(direction)) return;
      event.preventDefault();
      rotateView(view, ...direction);
    });

    function resize() {
      width = canvas.clientWidth;
      height = canvas.clientHeight;
      fitScale = Math.min(width - 42, height - 52) / (2 * sceneRadius);
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * pixelRatio);
      canvas.height = Math.round(height * pixelRatio);
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      draw();
    }

    new ResizeObserver(resize).observe(canvas);
    resize();
    updateControls();
  </script>
</body>
</html>
